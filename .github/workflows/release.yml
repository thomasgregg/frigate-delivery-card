name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish card release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify card release asset
        run: test -s frigate-delivery-card.js

      - name: Create draft release with card asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          frigate-delivery-card.js
          --draft
          --generate-notes
          --title "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
