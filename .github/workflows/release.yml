name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Build card ZIP
        run: >-
          git archive
          --format=zip
          --output="$RUNNER_TEMP/frigate-delivery-card.zip"
          HEAD
          frigate-delivery-card.js

      - name: Upload card release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          frigate-delivery-card.js
          "$RUNNER_TEMP/frigate-delivery-card.zip"
          --clobber
